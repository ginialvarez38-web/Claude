<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas del Mundo Conocido</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: el mapa ocupa toda la pantalla; título arriba a la izquierda, buscador y capas arriba a la derecha,
   viajes rápidos abajo, ficha del lugar como panel lateral (hoja inferior en teléfono). */
:root {
  color-scheme: dark;
  --night: #0e1b22;      /* cielo y niebla */
  --parch: #ece2c8;      /* texto: pergamino */
  --parch-dim: #b3a98f;
  --ruin: #a39d92;
  --sea-ink: #a9c7cf;    /* rótulos de mares */
  --wood-ink: #a8c095;   /* rótulos de bosques */
  --brass: #c9a35a;      /* acento: latón */
  --panel: rgba(14, 27, 34, .9);
  --line: rgba(236, 226, 200, .18);
  --display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --serif: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --ui: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--parch); font-family: var(--ui); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
#labels.off { display: none; }
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform, opacity; background: none; border: 0;
  padding: 2px 4px; text-shadow: 0 0 3px rgba(5, 12, 16, .95), 0 1px 2px rgba(5, 12, 16, .9); transition: opacity .25s; }
button.lbl { pointer-events: auto; cursor: pointer; }
button.lbl:hover, button.lbl:focus-visible, .lbl.sel { color: var(--brass) !important; outline: none; }
button.lbl:focus-visible span { text-decoration: underline; text-underline-offset: 3px; }
.city { padding-left: 12px; color: var(--parch); font: 14px/1.1 var(--serif); }
.city::before { content: ""; position: absolute; left: 0; top: 50%; width: 7px; height: 7px; margin-top: -3.5px;
  border-radius: 50%; background: var(--parch); box-shadow: 0 0 0 1.5px rgba(5, 12, 16, .85); }
.city.t1 { font-size: 15.5px; }
.city.t1::before { background: var(--brass); width: 8px; height: 8px; margin-top: -4px; }
.city.ciudad::before { border-radius: 1px; transform: rotate(45deg); }
.city.ruina { color: var(--ruin); font-style: italic; }
.city.ruina::before { background: none; box-shadow: inset 0 0 0 1.5px var(--ruin), 0 0 0 1px rgba(5, 12, 16, .7); }
.city.isla::before, .city.paso::before { width: 5px; height: 5px; margin-top: -2.5px; }
.region { font: 15px/1 var(--display); letter-spacing: .22em; color: var(--parch); opacity: .88; text-transform: uppercase; }
.region.big { font-size: 22px; letter-spacing: .3em; }
.sea { font: italic 15px/1 var(--serif); letter-spacing: .18em; color: var(--sea-ink); }
.sea.small { font-size: 12.5px; letter-spacing: .1em; }
.range { font: italic 12.5px/1 var(--serif); letter-spacing: .12em; color: var(--parch-dim); }
.forest { font: italic 12.5px/1 var(--serif); letter-spacing: .12em; color: var(--wood-ink); }

header { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none; max-width: min(420px, calc(100vw - 32px)); }
h1 { margin: 0; font: 26px/1.05 var(--display); letter-spacing: .06em; text-wrap: balance; text-shadow: 0 1px 3px rgba(5, 12, 16, .9); }
header p { margin: 4px 0 0; font: italic 15px/1.3 var(--serif); color: var(--parch-dim); text-shadow: 0 1px 3px rgba(5, 12, 16, .9); }

#tools { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
#search { display: flex; gap: 8px; align-items: center; }
#q { width: 220px; padding: 8px 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel);
  color: var(--parch); font: 15px var(--ui); }
#q::placeholder { color: var(--parch-dim); }
#q:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
#compass { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
  padding: 0; cursor: pointer; display: grid; place-items: center; }
#compass:focus-visible { outline: 2px solid var(--brass); }
#compass svg { width: 30px; height: 30px; }
#layers { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; max-width: 280px; }
#layers button { border: 1px solid var(--line); background: var(--panel); color: var(--parch-dim); font: 13px var(--ui);
  padding: 4px 9px; border-radius: 999px; cursor: pointer; }
#layers button[aria-pressed="true"] { color: var(--parch); border-color: rgba(201, 163, 90, .7); }
#layers button[aria-pressed="true"]::before { content: "● "; color: var(--brass); font-size: 10px; }
#layers button:focus-visible { outline: 2px solid var(--brass); }

#trips { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: center; pointer-events: none; }
#trips .row { display: flex; gap: 4px; overflow-x: auto; pointer-events: auto; padding: 4px; max-width: 100%;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; scrollbar-width: none; }
#trips button { flex: none; border: 0; background: none; color: var(--parch); font: 15px var(--serif); padding: 7px 11px;
  border-radius: 4px; cursor: pointer; }
#trips button:hover { background: rgba(236, 226, 200, .08); }
#trips button[aria-pressed="true"] { background: var(--brass); color: #1b1408; }
#trips button:focus-visible { outline: 2px solid var(--brass); outline-offset: -2px; }

#hint { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 74px);
  font-size: 13px; color: var(--parch-dim); text-shadow: 0 1px 2px rgba(5, 12, 16, .9); pointer-events: none; }

#panel { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 150px);
  width: 330px; max-height: calc(100% - 240px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 18px 20px 20px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
#panel .kicker { margin: 0; padding-right: 30px; font: 12px/1.3 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
#panel h2 { margin: 6px 0 10px; font: 28px/1.05 var(--display); text-wrap: balance; }
#panel .desc { margin: 0; font-size: 16px; line-height: 1.5; max-width: 60ch; }
#house { display: grid; grid-template-columns: 38px 1fr; gap: 4px 12px; align-items: center; margin: 0 0 14px;
  padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
#shield { width: 38px; height: 46px; grid-row: span 3; clip-path: path("M0 0 H38 V24 C38 37 27 43 19 46 C11 43 0 37 0 24 Z"); }
#hName { font: 17px/1.1 var(--display); min-width: 0; }
#hWords { font: italic 15px/1.2 var(--serif); color: var(--brass); min-width: 0; }
#hWords:empty { display: none; }
#hArms { font-size: 13.5px; line-height: 1.3; color: var(--parch-dim); min-width: 0; }
#close { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border: 0; border-radius: 4px; background: none;
  color: var(--parch-dim); font-size: 22px; line-height: 1; cursor: pointer; }
#close:hover { color: var(--parch); }
#close:focus-visible { outline: 2px solid var(--brass); }

#loading { position: fixed; inset: 0; display: grid; place-items: center; font: italic 20px var(--serif); color: var(--parch-dim);
  background: var(--night); text-align: center; padding: 24px; }

@media (max-width: 700px) {
  h1 { font-size: 21px; }
  header p { font-size: 13.5px; }
  #tools { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); left: max(16px, env(safe-area-inset-left, 0px));
    align-items: stretch; flex-direction: column-reverse; }
  #search { justify-content: flex-end; }
  #q { flex: 1; width: auto; min-width: 0; }
  #layers { max-width: none; justify-content: flex-start; }
  #hint { display: none; }
  #panel { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto;
    top: calc(env(safe-area-inset-top, 0px) + 74px); max-height: 40%; }
  .city { font-size: 13px; }
  .city.t1 { font-size: 14px; }
  .region.big { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { .lbl { transition: none; } }
</style>
</head>

<nav id="trips" aria-label="Viajes rápidos"><div class="row"></div></nav>

function ell(cx, cy, rx, ry, seed = 1) {
  const pts = [], n = 18;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    const k = 1 + 0.16 * Math.sin(a * 3 + seed) + 0.1 * Math.cos(a * 5 + seed * 2.3);
    pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
  }
  return pts;
}

/* ===== Ruido ===== */
function hash(i, j) {
  let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct) {
  let s = 0, amp = 1, norm = 0;
  for (let o = 0; o < oct; o++) { s += amp * noise(x, y); norm += amp; amp *= .5; x *= 2.03; y *= 2.03; }
  return s / norm;
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function rng(str) {
  let s = 0; for (const ch of str) s = (Math.imul(s, 31) + ch.charCodeAt(0)) | 0;
  return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

function chaikin(pts, it) {
  for (let k = 0; k < it; k++) {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], q = pts[(i + 1) % pts.length];
      out.push([p[0] * .75 + q[0] * .25, p[1] * .75 + q[1] * .25], [p[0] * .25 + q[0] * .75, p[1] * .25 + q[1] * .75]);
    }
    pts = out;
  }
  return pts;
}

function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0;
  t = Math.max(0, Math.min(1, t));
  const ex = ax + t * dx - px, ey = ay + t * dy - py;
  return Math.sqrt(ex * ex + ey * ey);
}

function chamfer(dist, nx, nz) {
  const D = 1.4142;
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
    const k = j * nx + i; let d = dist[k];
    if (i > 0) d = Math.min(d, dist[k - 1] + 1);
    if (j > 0) { d = Math.min(d, dist[k - nx] + 1); if (i > 0) d = Math.min(d, dist[k - nx - 1] + D); if (i < nx - 1) d = Math.min(d, dist[k - nx + 1] + D); }
    dist[k] = d;
  }
  for (let j = nz - 1; j >= 0; j--) for (let i = nx - 1; i >= 0; i--) {
    const k = j * nx + i; let d = dist[k];
    if (i < nx - 1) d = Math.min(d, dist[k + 1] + 1);
    if (j < nz - 1) { d = Math.min(d, dist[k + nx] + 1); if (i < nx - 1) d = Math.min(d, dist[k + nx + 1] + D); if (i > 0) d = Math.min(d, dist[k + nx - 1] + D); }
    dist[k] = d;
  }
}

/* Genera alturas y colores. Devuelve rejillas planas. */
function buildWorld(Color) {
  const cv = document.createElement('canvas');
  cv.width = W * MS; cv.height = H * MS;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  const fillPolys = (polys, color) => {
    ctx.fillStyle = color;
    for (const poly of polys) {
      const p = chaikin(poly, 3);
      ctx.beginPath();
      p.forEach(([x, y], i) => i ? ctx.lineTo((x + OFFX) * MS, y * MS) : ctx.moveTo((x + OFFX) * MS, y * MS));
      ctx.closePath(); ctx.fill();
    }
  };
  fillPolys(LANDS, '#fff'); fillPolys(LAKES, '#000'); fillPolys(LAKE_ISLES, '#fff');
  const img = ctx.getImageData(0, 0, cv.width, cv.height).data, MW = cv.width, MH = cv.height;
  const mask = (x, y) => {
    let px = x * MS - .5, py = y * MS - .5;
    px = Math.max(0, Math.min(MW - 2, px)); py = Math.max(0, Math.min(MH - 2, py));
    const i = px | 0, j = py | 0, fx = px - i, fy = py - j, at = (a, b) => img[(b * MW + a) * 4] / 255;
    return (at(i, j) * (1 - fx) + at(i + 1, j) * fx) * (1 - fy) + (at(i, j + 1) * (1 - fx) + at(i + 1, j + 1) * fx) * fy;
  };

  const NX = Math.round(W * RES) + 1, NZ = Math.round(H * RES) + 1, N = NX * NZ;
  const land = new Uint8Array(N), dl = new Float32Array(N), ds = new Float32Array(N);
  for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) {
    const x = i / RES, y = j / RES;
    const wx = x + 1.8 * (fbm(x * .09, y * .09, 3) - .5) + .9 * (fbm(x * .45 + 7, y * .45, 3) - .5);
    const wy = y + 1.8 * (fbm(x * .09 + 31, y * .09 + 17, 3) - .5) + .9 * (fbm(x * .45, y * .45 + 9, 3) - .5);
    const k = j * NX + i, L = mask(wx, wy) > .5 && i > 0 && j > 0 && i < NX - 1 && j < NZ - 1;
    land[k] = L ? 1 : 0;
    dl[k] = L ? 1e9 : 0; ds[k] = L ? 0 : 1e9;
  }
  chamfer(dl, NX, NZ); chamfer(ds, NX, NZ);

  const hgt = new Float32Array(N), col = new Float32Array(N * 3);
  const latStops = [[0,'#eef2f4'],[9,'#dde4e6'],[18,'#93a29a'],[24,'#566a52'],[50,'#5d7a4a'],[72,'#6c8a45'],[92,'#879449'],[140,'#5e8a43']]
    .map(([y, c]) => [y, new Color(c).convertSRGBToLinear()]);
  const tints = TINTS.map(([x, y, r, c, s]) => ({ x, y, r, s, c: new Color(c).convertSRGBToLinear() }));
  const rock = new Color('#7d746b').convertSRGBToLinear(), snow = new Color('#f2f5f7').convertSRGBToLinear();
  const beach = new Color('#cdbb8c').convertSRGBToLinear(), cliff = new Color('#6b6259').convertSRGBToLinear();
  const shallow = new Color('#4a7f86').convertSRGBToLinear(), deep = new Color('#0d2433').convertSRGBToLinear();
  const c = new Color();
  const boxes = RANGES.map(r => {
    const xs = r.pts.map(p => p[0]), ys = r.pts.map(p => p[1]), pad = r.w * 3;
    return [Math.min(...xs) - pad, Math.max(...xs) + pad, Math.min(...ys) - pad, Math.max(...ys) + pad];
  });

  for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) {
    const k = j * NX + i, x = i / RES, y = j / RES, dx = x - OFFX;
    let h;
    if (land[k]) {
      const d = dl[k] / RES, inl = 1 - Math.exp(-d / 2.5);
      h = .12 + 1.0 * (1 - Math.exp(-d / 7)) * (.55 + .7 * fbm(x * .06, y * .06, 3));
      const hl = fbm(x * .07 + 50, y * .07, 4); h += 1.1 * hl * hl * (1 - Math.exp(-d / 4));
      // colinas y quebradas: ruido crestado, más fuerte donde el terreno ya es alto
      const rg = 1 - Math.abs(2 * fbm(x * .16 + 9, y * .16 + 4, 4) - 1);
      h += .55 * rg * rg * smooth(.45, .75, fbm(x * .03 + 2, y * .03 + 8, 2)) * inl;
      h += .3 * (fbm(x * .4, y * .4, 4) - .5) * (1 - Math.exp(-d / 2));
      let ridge = 0;
      for (let r = 0; r < RANGES.length; r++) {
        const b = boxes[r]; if (dx < b[0] || dx > b[1] || y < b[2] || y > b[3]) continue;
        const R = RANGES[r]; let md = 1e9;
        for (let s = 0; s < R.pts.length - 1; s++) md = Math.min(md, segDist(dx, y, R.pts[s][0], R.pts[s][1], R.pts[s + 1][0], R.pts[s + 1][1]));
        const rn = 1 - Math.abs(2 * fbm(x * .22 + r * 13, y * .22, 4) - 1);
        ridge += R.h * Math.exp(-(md / R.w) * (md / R.w)) * (.4 + .75 * rn);
      }
      h += ridge * inl;
      hgt[k] = h;

      // color: latitud → regiones → roca y nieve → playa
      let s = 0; while (s < latStops.length - 2 && y > latStops[s + 1][0]) s++;
      const [y0, c0] = latStops[s], [y1, c1] = latStops[s + 1];
      c.lerpColors(c0, c1, Math.min(1, Math.max(0, (y - y0) / (y1 - y0))));
      for (const t of tints) {
        const dd = Math.hypot(dx - t.x, y - t.y); if (dd >= t.r) continue;
        const u = 1 - dd / t.r; c.lerp(t.c, t.s * u * u * (3 - 2 * u));
      }
      c.lerp(rock, smooth(1.7, 3.1, h) * .85);
      const sl = 4.2 + Math.max(0, y - 80) * .05 - Math.max(0, 30 - y) * .09;
      c.lerp(snow, smooth(sl, sl + .7, h));
      if (y < 14) c.lerp(snow, smooth(14, 4, y) * .8);
      // costa: playa baja o acantilado según el ruido
      const coastal = 1 - smooth(.12, .34, h);
      c.lerp(fbm(x * .2, y * .2, 2) > .55 ? cliff : beach, coastal * .5);
      c.multiplyScalar(.88 + .24 * fbm(x * .5 + 3, y * .5 + 3, 3));
    } else {
      const d = ds[k] / RES, t = 1 - Math.exp(-d / 6);
      h = -.12 - 2.4 * t + .3 * (fbm(x * .1, y * .1, 2) - .5) * t;
      hgt[k] = h;
      c.lerpColors(shallow, deep, Math.pow(t, .7));
    }
    col[k * 3] = c.r; col[k * 3 + 1] = c.g; col[k * 3 + 2] = c.b;
  }
  return { NX, NZ, hgt, col };
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

function start() {
  if (!window.THREE || !THREE.OrbitControls) {
    $('loading').textContent = 'No se pudo cargar el motor 3D. Revisá la conexión y recargá la página.';
    return;
  }
  const { NX, NZ, hgt, col } = buildWorld(THREE.Color);
  const toX = x => x + OFFX - W / 2, toZ = y => y - H / 2;
  const heightAt = (x, y) => {   // coordenadas del atlas
    let gi = (x + OFFX) * RES, gj = y * RES;
    gi = Math.max(0, Math.min(NX - 1.001, gi)); gj = Math.max(0, Math.min(NZ - 1.001, gj));
    const i = gi | 0, j = gj | 0, fx = gi - i, fy = gj - j, g = (a, b) => hgt[b * NX + a];
    return (g(i, j) * (1 - fx) + g(i + 1, j) * fx) * (1 - fy) + (g(i, j + 1) * (1 - fx) + g(i + 1, j + 1) * fx) * fy;
  };
  const lin = hex => new THREE.Color(hex).convertSRGBToLinear();

  const stage = $('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#0e1b22');
  scene.fog = new THREE.Fog('#0e1b22', 320, 720);
  const camera = new THREE.PerspectiveCamera(40, 1, .3, 2000);

  // terreno
  const pos = new Float32Array(NX * NZ * 3);
  for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) {
    const k = j * NX + i;
    pos[k * 3] = i / RES - W / 2; pos[k * 3 + 1] = hgt[k]; pos[k * 3 + 2] = j / RES - H / 2;
  }
  const idx = new Uint32Array((NX - 1) * (NZ - 1) * 6);
  let p = 0;
  for (let j = 0; j < NZ - 1; j++) for (let i = 0; i < NX - 1; i++) {
    const a = j * NX + i, b = a + 1, c = a + NX, d = c + 1;
    idx[p++] = a; idx[p++] = c; idx[p++] = b; idx[p++] = b; idx[p++] = c; idx[p++] = d;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .95, metalness: 0 })));

  // mar con oleaje: mapa de normales hecho con ruido
  const NS = 128, ncv = document.createElement('canvas'); ncv.width = ncv.height = NS;
  const nctx = ncv.getContext('2d'), nimg = nctx.createImageData(NS, NS);
  const wave = (x, y) => fbm(x / NS * 8, y / NS * 8, 3);
  for (let y = 0; y < NS; y++) for (let x = 0; x < NS; x++) {

    // no meter la cámara bajo tierra
    const ground = heightAt(camera.position.x - OFFX + W / 2, camera.position.z + H / 2);
    if (camera.position.y < Math.max(ground, 0) + .8) camera.position.y = Math.max(ground, 0) + .8;

    if (!reduceMotion) {
      for (let e = 0; e < EMB; e++) {
        ember[e * 3 + 1] += emberBase[e][3] * dt;
        if (ember[e * 3 + 1] > emberBase[e][1] + 4.5) ember[e * 3 + 1] = emberBase[e][1];
      }
      emberGeo.attributes.position.needsUpdate = true;
      fire.intensity = 2 + Math.sin(now * .007) * .4 + Math.sin(now * .019) * .25;
      normalTex.offset.x += dt * .006; normalTex.offset.y += dt * .003;
      if (groups.barcos.visible) moveBoats(dt);
    }
    renderer.render(scene, camera);

    if (!layer.classList.contains('off')) {
      const w = innerWidth, h = innerHeight;
      for (const L of labels) {
        v.copy(L.pos).project(camera);
        const d = camera.position.distanceTo(L.pos);
        let op = 0;
        if (v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1 && d < L.max && d > L.min) {
          op = Math.min(1, (L.max - d) / (L.max * .15));
          if (L.min) op = Math.min(op, (d - L.min) / (L.min * .2));
        }
        if (L === selected && v.z < 1) op = 1;
        const vis = op > .02;
        if (vis !== L.vis) { L.el.style.visibility = vis ? 'visible' : 'hidden'; L.vis = vis; }
        if (!vis) continue;
        const sx = (v.x * .5 + .5) * w, sy = (-v.y * .5 + .5) * h;
        L.el.style.transform = L.kind === 'city'
          ? `translate(${sx - 4}px, ${sy}px) translateY(-50%)`
          : `translate(${sx}px, ${sy}px) translate(-50%, -50%)`;
        L.el.style.opacity = op.toFixed(2);
      }
    }
    needle.setAttribute('transform', `rotate(${(controls.getAzimuthalAngle() * 180 / Math.PI).toFixed(1)} 15 15)`);
    requestAnimationFrame(frame);
  }
  $('loading').remove();
  requestAnimationFrame(frame);
}

requestAnimationFrame(() => setTimeout(start, 30));
</script>
</body>
</html>
